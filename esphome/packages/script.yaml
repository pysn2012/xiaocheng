# 脚本 + 定时器：显示调度 / 键盘扫描 / 灯光场景 / 联网指示灯

script:
  # ============ 显示调度：根据 WiFi/HA/语音阶段 选页面 ============
  - id: draw_display
    then:
      - if:
          condition:
            lambda: return !id(init_in_progress);
          then:
            - if:
                condition:
                  wifi.connected:
                then:
                  - if:
                      condition:
                        api.connected:
                      then:
                        - lambda: |-
                            switch(id(voice_assistant_phase)) {
                              case ${voice_assist_listening_phase_id}:
                                id(lcd).show_page(listening_page);  id(lcd).update(); break;
                              case ${voice_assist_thinking_phase_id}:
                                id(lcd).show_page(thinking_page);   id(lcd).update(); break;
                              case ${voice_assist_replying_phase_id}:
                                id(lcd).show_page(replying_page);   id(lcd).update(); break;
                              case ${voice_assist_error_phase_id}:
                                id(lcd).show_page(error_page);      id(lcd).update(); break;
                              case ${voice_assist_muted_phase_id}:
                                id(lcd).show_page(muted_page);      id(lcd).update(); break;
                              case ${voice_assist_not_ready_phase_id}:
                                id(lcd).show_page(no_ha_page);      id(lcd).update(); break;
                              case ${voice_assist_timer_finished_phase_id}:
                                id(lcd).show_page(timer_finished_page); id(lcd).update(); break;
                              default:
                                id(lcd).show_page(idle_page);       id(lcd).update(); break;
                            }
                      else:
                        - display.page.show: no_ha_page
                        - component.update: lcd
                else:
                  - display.page.show: no_wifi_page
                  - component.update: lcd
          else:
            - display.page.show: initializing_page
            - component.update: lcd

  # ============ 键盘扫描：2 行 x 3 列 ============
  # 整轮扫描在**一个 lambda 内**跑完（拉低行 → 忙等 settle → 现场读 XL9535 输入
  # 寄存器 → 拉高行 → 行间放电），全程不让出主循环。
  # 为什么必须这样：之前用 script 动作 + delay，行线低电平会跨过 yield 点；主循环
  # 被 mWW 推理/流式/显示负载卡住时（日志 "key_scan already running" 刷屏就是征兆），
  # 列传感器会把"按下"状态持续发布超过 50ms，delayed_on 消抖也拦不住 → 幽灵按键（跳静音）。
  # 列线按下=低电平（XL9535 输入弱上拉，松开为高），故 pressed = !digital_read(pin)。
  - id: key_scan
    mode: single
    then:
      - lambda: |-
          auto col_down = [](uint8_t pin) { return !id(xl9535_hub).digital_read(pin); };
          // delayMicroseconds ≤5ms 是纯忙等，不会 yield，保证行线低电平窗口原子

          // 行 A（GPIO0）：A=P0.0 / RIGHT=P0.4 / UP=P0.6
          id(key_row_a).turn_off();
          delayMicroseconds(2000);
          bool a_a = col_down(0);
          bool a_right = col_down(4);
          bool a_up = col_down(6);
          id(key_row_a).turn_on();
          id(key_a).publish_state(a_a);
          id(key_right).publish_state(a_right);
          id(key_up).publish_state(a_up);
          delayMicroseconds(1500);  // 行间放电：等列线寄生电容复位（对齐 dcp KEY_DISCHARGE_MS）

          // 行 B（GPIO46）：DOWN=P0.0 / B=P0.4 / LEFT=P0.6
          id(key_row_b).turn_off();
          delayMicroseconds(2000);
          bool b_down = col_down(0);
          bool b_b = col_down(4);
          bool b_left = col_down(6);
          id(key_row_b).turn_on();
          id(key_down).publish_state(b_down);
          id(key_b).publish_state(b_b);
          id(key_left).publish_state(b_left);

  # ============ WS2812 状态灯效（由语音助手阶段驱动）============
  - id: va_light_off
    then:
      - light.turn_off: ws2812

  # Listening：白色呼吸
  - id: va_light_listening
    then:
      - light.turn_on:
          id: ws2812
          brightness: 60%
          red: 100%
          green: 100%
          blue: 100%
          effect: "Pulse"

  # Thinking：蓝色扫描
  - id: va_light_thinking
    then:
      - light.turn_on:
          id: ws2812
          brightness: 60%
          red: 0%
          green: 0%
          blue: 100%
          effect: "Scan"

  # Replying：随机闪烁（近似"语音律动"；播放时麦克风已关闭，拿不到实时音量）
  - id: va_light_replying
    then:
      - light.turn_on:
          id: ws2812
          brightness: 80%
          red: 100%
          green: 60%
          blue: 0%
          effect: "Flicker"

  # ============ 唤醒词启停（设备端 mWW / HA 端流式）============
  - id: start_wake_word
    then:
      - if:
          condition:
            and:
              - not:
                  - voice_assistant.is_running:
              - lambda: return id(wake_word_engine_location).current_option() == "On device";
          then:
            - lambda: id(va).set_use_wake_word(false);
            - micro_wake_word.start:
      - if:
          condition:
            and:
              - not:
                  - voice_assistant.is_running:
              - lambda: return id(wake_word_engine_location).current_option() == "In Home Assistant";
          then:
            - lambda: id(va).set_use_wake_word(true);
            - voice_assistant.start_continuous:

  - id: stop_wake_word
    then:
      - if:
          condition:
            lambda: return id(wake_word_engine_location).current_option() == "In Home Assistant";
          then:
            - lambda: id(va).set_use_wake_word(false);
            - voice_assistant.stop:
      - if:
          condition:
            lambda: return id(wake_word_engine_location).current_option() == "On device";
          then:
            - micro_wake_word.stop:

  # 根据静音开关设置当前阶段（回空闲时关灯 + 随机选一句问候语）
  - id: set_idle_or_mute_phase
    then:
      - light.turn_off: ws2812
      - lambda: |-
          id(greet_idx) = rand() % 7;
      - if:
          condition:
            switch.is_off: mute
          then:
            - lambda: id(voice_assistant_phase) = ${voice_assist_idle_phase_id};
          else:
            - lambda: id(voice_assistant_phase) = ${voice_assist_muted_phase_id};

interval:
  # 键盘扫描 50Hz
  - interval: 20ms
    then:
      - script.execute: key_scan

  # 联网指示灯：等联网=蓝灯闪；联网成功=蓝灯灭+绿灯常亮
  - interval: 500ms
    then:
      - if:
          condition:
            wifi.connected:
          then:
            - switch.turn_off: led_blue
            - switch.turn_on: led_green
          else:
            - switch.toggle: led_blue
            - switch.turn_off: led_green

  # 空闲页每 10s 重绘一次，刷新时钟和电池角标
  - interval: 10s
    then:
      - if:
          condition:
            lambda: return id(voice_assistant_phase) == ${voice_assist_idle_phase_id};
          then:
            - script.execute: draw_display

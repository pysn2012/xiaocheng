# 脚本 + 定时器：显示调度 / 键盘扫描 / 灯光场景 / 联网指示灯

script:
  # ============ 显示调度：根据 WiFi/HA/语音阶段 选页面 ============
  - id: draw_display
    then:
      - if:
          condition:
            lambda: return !id(init_in_progress);
          then:
            - if:
                condition:
                  wifi.connected:
                then:
                  - if:
                      condition:
                        api.connected:
                      then:
                        - lambda: |-
                            switch(id(voice_assistant_phase)) {
                              case ${voice_assist_listening_phase_id}:
                                id(lcd).show_page(listening_page);  id(lcd).update(); break;
                              case ${voice_assist_thinking_phase_id}:
                                id(lcd).show_page(thinking_page);   id(lcd).update(); break;
                              case ${voice_assist_replying_phase_id}:
                                id(lcd).show_page(replying_page);   id(lcd).update(); break;
                              case ${voice_assist_error_phase_id}:
                                id(lcd).show_page(error_page);      id(lcd).update(); break;
                              case ${voice_assist_muted_phase_id}:
                                id(lcd).show_page(muted_page);      id(lcd).update(); break;
                              case ${voice_assist_not_ready_phase_id}:
                                id(lcd).show_page(no_ha_page);      id(lcd).update(); break;
                              case ${voice_assist_timer_finished_phase_id}:
                                id(lcd).show_page(timer_finished_page); id(lcd).update(); break;
                              default:
                                id(lcd).show_page(idle_page);       id(lcd).update(); break;
                            }
                      else:
                        - display.page.show: no_ha_page
                        - component.update: lcd
                else:
                  - display.page.show: no_wifi_page
                  - component.update: lcd
          else:
            - display.page.show: initializing_page
            - component.update: lcd

  # ============ 键盘扫描：2 行 x 3 列，差分法 ============
  # 判键逻辑全部在 key_scan.h（xiaocheng::key_scan_row），对齐 mpup 的
  # xiaocheng-esp32s3 matrix_key_input.cpp：
  #   行拉低读一次 → 行拉高读一次 → low ^ high 才是闭合键。
  # 为什么不能用"拉低行读到低就算按下"：本机列线悬空、无上下拉，松手时列电平
  # 不确定，会被当成按下（乱跳）；而真实按键又受行线阻抗影响（没反应）。
  # 整轮扫描在一个 lambda 内跑完，行线电平切换与 I2C 读取之间不 yield，
  # 避免主循环被 mWW 推理/显示负载卡住时行线停在低电平过久（幽灵按键）。
  - id: key_scan
    mode: single
    then:
      - lambda: |-
          static bool rows_ready = false;
          if (!rows_ready) {
            xiaocheng::key_rows_init();   // 行线初始化成高阻输入（只做一次）
            rows_ready = true;
          }
          // 行 A（GPIO0）：A=P0.0 / RIGHT=P0.4 / UP=P0.6
          const uint8_t a = xiaocheng::key_scan_row(id(xl9535_hub), xiaocheng::KEY_ROW_A);
          id(key_a).publish_state((a & xiaocheng::KEY_COL_BIT0) != 0);
          id(key_right).publish_state((a & xiaocheng::KEY_COL_BIT4) != 0);
          id(key_up).publish_state((a & xiaocheng::KEY_COL_BIT6) != 0);
          // 行 B（GPIO46）：DOWN=P0.0 / B=P0.4 / LEFT=P0.6
          const uint8_t b = xiaocheng::key_scan_row(id(xl9535_hub), xiaocheng::KEY_ROW_B);
          id(key_down).publish_state((b & xiaocheng::KEY_COL_BIT0) != 0);
          id(key_b).publish_state((b & xiaocheng::KEY_COL_BIT4) != 0);
          id(key_left).publish_state((b & xiaocheng::KEY_COL_BIT6) != 0);

  # ============ 问候语切换（只有 RIGHT 键：循环下一句）============
  # 问候语表在 display_helpers.h（GREETINGS / GREETINGS_COUNT），条数只在那里改。
  # 切过之后 greet_manual 置位：回到空闲就不再随机取词，否则刚挑好的那句
  # 一对话就被随机换掉。重启后恢复随机。
  - id: greet_next
    then:
      - lambda: |-
          id(greet_manual) = true;
          id(greet_idx) = (id(greet_idx) + 1) % GREETINGS_COUNT;
      - script.execute: draw_display

  # ============ WS2812 状态灯效（由语音助手阶段驱动）============
  - id: va_light_off
    then:
      - light.turn_off: ws2812

  # Listening：白色呼吸
  - id: va_light_listening
    then:
      - light.turn_on:
          id: ws2812
          brightness: 60%
          red: 100%
          green: 100%
          blue: 100%
          effect: "Pulse"

  # Thinking：蓝色扫描
  - id: va_light_thinking
    then:
      - light.turn_on:
          id: ws2812
          brightness: 60%
          red: 0%
          green: 0%
          blue: 100%
          effect: "Scan"

  # Replying：随机闪烁（近似"语音律动"；播放时麦克风已关闭，拿不到实时音量）
  - id: va_light_replying
    then:
      - light.turn_on:
          id: ws2812
          brightness: 80%
          red: 100%
          green: 60%
          blue: 0%
          effect: "Flicker"

  # ============ 唤醒词启停（设备端 mWW / HA 端流式）============
  - id: start_wake_word
    then:
      - if:
          condition:
            and:
              - not:
                  - voice_assistant.is_running:
              - lambda: return id(wake_word_engine_location).current_option() == "On device";
          then:
            - lambda: id(va).set_use_wake_word(false);
            - micro_wake_word.start:
      - if:
          condition:
            and:
              - not:
                  - voice_assistant.is_running:
              - lambda: return id(wake_word_engine_location).current_option() == "In Home Assistant";
          then:
            - lambda: id(va).set_use_wake_word(true);
            - voice_assistant.start_continuous:

  - id: stop_wake_word
    then:
      - if:
          condition:
            lambda: return id(wake_word_engine_location).current_option() == "In Home Assistant";
          then:
            - lambda: id(va).set_use_wake_word(false);
            - voice_assistant.stop:
      - if:
          condition:
            lambda: return id(wake_word_engine_location).current_option() == "On device";
          then:
            - micro_wake_word.stop:

  # 根据静音开关设置当前阶段（回空闲时关灯 + 随机选一句问候语）
  # 手动用 RIGHT 切过（greet_manual）就不随机，保留用户挑的那句
  - id: set_idle_or_mute_phase
    then:
      - light.turn_off: ws2812
      - lambda: |-
          if (!id(greet_manual))
            id(greet_idx) = rand() % GREETINGS_COUNT;
      - if:
          condition:
            switch.is_off: mute
          then:
            - lambda: id(voice_assistant_phase) = ${voice_assist_idle_phase_id};
          else:
            - lambda: id(voice_assistant_phase) = ${voice_assist_muted_phase_id};

interval:
  # 键盘扫描 50Hz
  - interval: 20ms
    then:
      - script.execute: key_scan

  # 联网指示灯：等联网=蓝灯闪；联网成功=蓝灯灭+绿灯常亮
  - interval: 500ms
    then:
      - if:
          condition:
            wifi.connected:
          then:
            - switch.turn_off: led_blue
            - switch.turn_on: led_green
          else:
            - switch.toggle: led_blue
            - switch.turn_off: led_green

  # 空闲页每 10s 重绘一次，刷新时钟和电池角标
  - interval: 10s
    then:
      - if:
          condition:
            lambda: return id(voice_assistant_phase) == ${voice_assist_idle_phase_id};
          then:
            - script.execute: draw_display

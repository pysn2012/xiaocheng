# ============================================================
# 硬件层：芯片/总线/屏幕/灯/键盘矩阵
# 注意顺序：电源开关（XL9535）放在音频芯片之前声明，
# 保证上电时先开 P1.4 音频电源 / P0.7 LDO，再初始化 ES7210/ES8311
# 页面绘制辅助函数见 display_helpers.h（draw_battery / draw_wrapped）
# ============================================================

esp32:
  variant: esp32s3
  flash_size: 16MB
  cpu_frequency: 240MHz
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240: "y"
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"

psram:
  mode: octal
  speed: 80MHz

# 颜色对象（页面绘制用 id() 引用；hex 值来自主配置 substitutions）
color:
  - id: bg_color
    hex: ${bg_color}
  - id: text_color
    hex: ${text_color}
  - id: accent_color
    hex: ${accent_color}
  - id: dark_text_color      # 白底图片上的深色文字（电池角标/对话文本）
    hex: "000000"

# 状态图片（casita/ 目录，320x240 全屏，路径相对主配置目录）
image:
  - file: casita/idle_320_240.png
    id: img_idle
    type: RGB
  - file: casita/loading_320_240.png
    id: img_loading
    type: RGB
  - file: casita/listening_320_240.png
    id: img_listening
    type: RGB
  - file: casita/thinking_320_240.png
    id: img_thinking
    type: RGB
  - file: casita/replying_320_240.png
    id: img_replying
    type: RGB
  - file: casita/error_320_240.png
    id: img_error
    type: RGB
  - file: casita/timer_finished_320_240.png
    id: img_timer_finished
    type: RGB

# I2C1：XL9535 / ES8311 / ES7210（400kHz：默认 50kHz 太慢，键盘轮询会超时告警）
i2c:
  - id: i2c_bus
    scl: GPIO7
    sda: GPIO12
    frequency: 400kHz
    scan: true

# SPI：LCD ST7789（SCK=47, MOSI=45）
spi:
  - id: spi_bus
    clk_pin: GPIO47
    mosi_pin: GPIO45

# I2S0：MCLK=15, BCLK=16, WS=17（DOUT=13→喇叭 / DIN=18←麦克风，在语音模块里）
i2s_audio:
  - id: i2s_bus
    i2s_mclk_pin: GPIO15
    i2s_bclk_pin: GPIO16
    i2s_lrclk_pin: GPIO17

# ---- XL9535 IO 扩展（0x20，16 路）----
xl9535:
  - id: xl9535_hub
    address: 0x20

# ---- 电源/LED 开关（XL9535 扩展引脚）----
switch:
  # 音频电源（必须先于 audio_adc/dac 初始化，见文件头说明）
  - platform: gpio
    id: audio_power
    name: "Audio Power"
    pin:
      xl9535: xl9535_hub
      number: ${xl_pin_audio_pwr}
      mode: { output: true }
    restore_mode: ALWAYS_ON

  # LDO 使能
  - platform: gpio
    id: ldo_enable
    name: "LDO"
    pin:
      xl9535: xl9535_hub
      number: ${xl_pin_ldo}
      mode: { output: true }
    restore_mode: ALWAYS_ON

  # 功放（NS4152）使能
  - platform: gpio
    id: amp_enable
    name: "Amp Enable"
    pin:
      xl9535: xl9535_hub
      number: ${xl_pin_amp_en}
      mode: { output: true }
    restore_mode: RESTORE_DEFAULT_ON

  # 电池 ADC 采样使能（高电平）
  - platform: gpio
    id: battery_adc_en
    pin:
      xl9535: xl9535_hub
      number: ${xl_pin_adc_en}
      mode: { output: true }
    restore_mode: ALWAYS_ON
    internal: true

  # 状态 LED（若实测亮灭相反，给对应 pin 加 inverted: true）
  - platform: gpio
    id: led_green
    name: "LED Green"
    pin:
      xl9535: xl9535_hub
      number: ${xl_pin_led_green}
      mode: { output: true }
    restore_mode: ALWAYS_OFF

  - platform: gpio
    id: led_blue
    name: "LED Blue"
    pin:
      xl9535: xl9535_hub
      number: ${xl_pin_led_blue}
      mode: { output: true }
    restore_mode: ALWAYS_OFF

  # ---- 键盘矩阵行（原生 GPIO，行输出；空闲拉高，扫描时拉低）----
  - platform: gpio
    id: key_row_a     # GPIO0：A / RIGHT / UP
    pin: GPIO0
    restore_mode: ALWAYS_ON
    internal: true

  - platform: gpio
    id: key_row_b     # GPIO46：DOWN / B / LEFT
    pin: GPIO46
    restore_mode: ALWAYS_ON
    internal: true

# ---- 键盘矩阵列（XL9535 输入，按下=低电平；inverted 必须放在 pin 里）----
binary_sensor:
  - platform: gpio
    id: bs_col0
    pin:
      xl9535: xl9535_hub
      number: ${xl_pin_key_col0}
      mode: INPUT
      inverted: true
    internal: true

  - platform: gpio
    id: bs_col4
    pin:
      xl9535: xl9535_hub
      number: ${xl_pin_key_col4}
      mode: INPUT
      inverted: true
    internal: true

  - platform: gpio
    id: bs_col6
    pin:
      xl9535: xl9535_hub
      number: ${xl_pin_key_col6}
      mode: INPUT
      inverted: true
    internal: true

  # ---- 6 个功能键（由 script.yaml 的 key_scan 扫描发布状态）----
  - platform: template
    id: key_a
    internal: true
    on_press:
      - switch.toggle: mute             # A 静音切换

  - platform: template
    id: key_right
    internal: true
    on_press:
      - light.toggle: backlight         # RIGHT 屏幕背光开关

  - platform: template
    id: key_up
    internal: true
    on_press:
      - media_player.volume_up:         # UP 音量 +
          id: speaker_media_player

  - platform: template
    id: key_down
    internal: true
    on_press:
      - media_player.volume_down:       # DOWN 音量 -
          id: speaker_media_player

  - platform: template
    id: key_b
    internal: true
    on_press:
      - light.turn_off: ws2812          # B 手动关灯（下次状态切换自动恢复）

  - platform: template
    id: key_left
    internal: true
    on_press:
      - if:                             # LEFT 取消当前对话
          condition:
            voice_assistant.is_running:
          then:
            - voice_assistant.stop:

# ---- 输出：屏幕背光 BL=GPIO14 ----
output:
  - platform: ledc
    pin: GPIO14
    id: backlight_output

# ---- 灯 ----
light:
  # 屏幕背光
  - platform: monochromatic
    id: backlight
    name: "LCD Backlight"
    output: backlight_output
    restore_mode: ALWAYS_ON
    entity_category: config

  # 10 颗 WS2812（esp-idf 框架下用 RMT 方案，不用 neopixelbus）
  - platform: esp32_rmt_led_strip
    id: ws2812
    name: "Ambient Light"
    pin: GPIO42
    num_leds: 10
    rgb_order: GRB
    chipset: ws2812
    restore_mode: ALWAYS_OFF
    effects:
      - addressable_rainbow:
      - addressable_scan:
      - pulse:
      - flicker:
      - strobe:

# ---- 音频编解码器（I2C 控制 + I2S 数据）----
audio_adc:
  - platform: es7210
    id: es7210_adc
    i2c_id: i2c_bus
    address: 0x43          # 按小程实测（ADDR 跳线），非默认 0x40
    bits_per_sample: 16bit
    sample_rate: 16000

audio_dac:
  - platform: es8311
    id: es8311_dac
    i2c_id: i2c_bus
    address: 0x18
    bits_per_sample: 16bit
    sample_rate: 48000

# ---- 屏幕：mipi_spi 新 API（旧版是 st7789v 平台，不可混用）----
display:
  - platform: mipi_spi
    id: lcd
    model: ST7789V
    cs_pin: GPIO21
    dc_pin: GPIO48
    reset_pin:
      xl9535: xl9535_hub
      number: ${xl_pin_lcd_rst}
    dimensions:
      width: 240
      height: 320
    rotation: 90°          # 2.0" 屏横屏 320x240；方向不对改 0°/180°/270°
    invert_colors: true
    data_rate: 40MHz       # 默认 10MHz 整屏重绘要 200ms+，会阻塞主循环；花屏就降回 20MHz
    update_interval: never
    pages:
      # 初始化中（黑底图）
      - id: initializing_page
        lambda: |-
          it.image(160, 120, id(img_loading), ImageAlign::CENTER);
          draw_battery(it, id(font_small), id(text_color), id(battery_voltage), id(battery_percent));
      # 无 WiFi（文字页）
      - id: no_wifi_page
        lambda: |-
          it.fill(id(bg_color));
          it.printf(160, 100, id(font_main), id(text_color), esphome::display::TextAlign::TOP_CENTER, "未连接WiFi");
          draw_battery(it, id(font_small), id(text_color), id(battery_voltage), id(battery_percent));
      # 无 Home Assistant（文字页）
      - id: no_ha_page
        lambda: |-
          it.fill(id(bg_color));
          it.printf(160, 100, id(font_main), id(text_color), esphome::display::TextAlign::TOP_CENTER, "未连接HA");
          draw_battery(it, id(font_small), id(text_color), id(battery_voltage), id(battery_percent));
      # 空闲（黑底图）
      - id: idle_page
        lambda: |-
          it.image(160, 120, id(img_idle), ImageAlign::CENTER);
          draw_battery(it, id(font_small), id(text_color), id(battery_voltage), id(battery_percent));
      # 聆听（白底图）
      - id: listening_page
        lambda: |-
          it.image(160, 120, id(img_listening), ImageAlign::CENTER);
          draw_battery(it, id(font_small), id(dark_text_color), id(battery_voltage), id(battery_percent));
      # 思考（白底图）
      - id: thinking_page
        lambda: |-
          it.image(160, 120, id(img_thinking), ImageAlign::CENTER);
          draw_battery(it, id(font_small), id(dark_text_color), id(battery_voltage), id(battery_percent));
      # 回复：白底图 + 顶部问题框 / 底部回复框，中间图案不被遮挡
      - id: replying_page
        lambda: |-
          it.image(160, 120, id(img_replying), ImageAlign::CENTER);
          it.filled_rectangle(10, 4, 300, 44, id(text_color));
          draw_wrapped(it, id(text_request), id(font_small), id(dark_text_color), 6, 290, 2, 18);
          it.filled_rectangle(10, 178, 300, 58, id(text_color));
          draw_wrapped(it, id(text_response), id(font_small), id(dark_text_color), 180, 290, 3, 18);
          draw_battery(it, id(font_small), id(dark_text_color), id(battery_voltage), id(battery_percent));
      # 错误（黑底图）
      - id: error_page
        lambda: |-
          it.image(160, 120, id(img_error), ImageAlign::CENTER);
          draw_battery(it, id(font_small), id(text_color), id(battery_voltage), id(battery_percent));
      # 定时器结束（白底图）
      - id: timer_finished_page
        lambda: |-
          it.image(160, 120, id(img_timer_finished), ImageAlign::CENTER);
          draw_battery(it, id(font_small), id(dark_text_color), id(battery_voltage), id(battery_percent));
      # 静音
      - id: muted_page
        lambda: |-
          it.fill(id(bg_color));
          it.printf(160, 100, id(font_main), id(text_color), esphome::display::TextAlign::TOP_CENTER, "已静音");
          draw_battery(it, id(font_small), id(text_color), id(battery_voltage), id(battery_percent));

# ============================================================
# 硬件层：芯片/总线/屏幕/灯/键盘矩阵
# 注意顺序：电源开关（XL9535）放在音频芯片之前声明，
# 保证上电时先开 P1.4 音频电源 / P0.7 LDO，再初始化 ES7210/ES8311
# 页面绘制辅助函数见 display_helpers.h（draw_battery / draw_wrapped）
# ============================================================

# 上电时序（对齐 xiaozhi-zyb xiaocheng-h1）：
# 音频电源/LDO 由 restore_mode ALWAYS_ON 在硬件初始化阶段就接通（codec 初始化
# 依赖它们）；功放 NS4152 为 ALWAYS_OFF，由主配置 xiaocheng-va.yaml 的
# esphome.on_boot 延迟接通（等 codec/I2S 稳定后再上功放，消除开机 pop）。

esp32:
  variant: esp32s3
  flash_size: 16MB
  cpu_frequency: 240MHz
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240: "y"
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"

psram:
  mode: octal
  speed: 80MHz

# 颜色对象（页面绘制用 id() 引用；hex 值来自主配置 substitutions）
color:
  - id: bg_color
    hex: ${bg_color}
  - id: text_color
    hex: ${text_color}
  - id: accent_color
    hex: ${accent_color}
  - id: dark_text_color      # 白底图片上的深色文字（电池角标/对话文本）
    hex: "000000"

# 状态图片（casita/ 目录，320x240 全屏，路径相对主配置目录）
# 新 API：image 是组件平台（旧写法 2027.1.0 起移除）
image:
  - platform: file
    file: casita/idle_320_240.png
    id: img_idle
    type: RGB
  - platform: file
    file: casita/loading_320_240.png
    id: img_loading
    type: RGB
  - platform: file
    file: casita/listening_320_240.png
    id: img_listening
    type: RGB
  - platform: file
    file: casita/thinking_320_240.png
    id: img_thinking
    type: RGB
  - platform: file
    file: casita/replying_320_240.png
    id: img_replying
    type: RGB
  - platform: file
    file: casita/error_320_240.png
    id: img_error
    type: RGB
  - platform: file
    file: casita/timer_finished_320_240.png
    id: img_timer_finished
    type: RGB

# I2C1：XL9535 / ES8311 / ES7210（400kHz：默认 50kHz 太慢，键盘轮询会超时告警）
i2c:
  - id: i2c_bus
    scl: GPIO7
    sda: GPIO12
    frequency: 400kHz
    scan: true

# SPI：LCD ST7789（SCK=47, MOSI=45）
spi:
  - id: spi_bus
    clk_pin: GPIO47
    mosi_pin: GPIO45

# I2S0：MCLK=15, BCLK=16, WS=17（DOUT=13→喇叭 / DIN=18←麦克风，在语音模块里）
i2s_audio:
  - id: i2s_bus
    i2s_mclk_pin: GPIO15
    i2s_bclk_pin: GPIO16
    i2s_lrclk_pin: GPIO17

# ---- XL9535 IO 扩展（0x20，16 路）----
xl9535:
  - id: xl9535_hub
    address: 0x20

# ---- 电源/LED 开关（XL9535 扩展引脚）----
switch:
  # 音频电源（必须先于 audio_adc/dac 初始化，见文件头说明）
  - platform: gpio
    id: audio_power
    name: "Audio Power"
    pin:
      xl9535: xl9535_hub
      number: ${xl_pin_audio_pwr}
      mode: { output: true }
    restore_mode: ALWAYS_ON

  # LDO 使能
  - platform: gpio
    id: ldo_enable
    name: "LDO"
    pin:
      xl9535: xl9535_hub
      number: ${xl_pin_ldo}
      mode: { output: true }
    restore_mode: ALWAYS_ON

  # 功放（NS4152）使能：上电不自动开，由 on_boot 延迟 1s 后再接通
  # （对齐 xiaozhi 上电时序：等音频电源/codec 稳定后再上功放，消除开机 pop）
  - platform: gpio
    id: amp_enable
    name: "Amp Enable"
    pin:
      xl9535: xl9535_hub
      number: ${xl_pin_amp_en}
      mode: { output: true }
    restore_mode: ALWAYS_OFF

  # 电池 ADC 采样使能（高电平）
  - platform: gpio
    id: battery_adc_en
    pin:
      xl9535: xl9535_hub
      number: ${xl_pin_adc_en}
      mode: { output: true }
    restore_mode: ALWAYS_ON
    internal: true

  # 状态 LED（若实测亮灭相反，给对应 pin 加 inverted: true）
  - platform: gpio
    id: led_green
    name: "LED Green"
    pin:
      xl9535: xl9535_hub
      number: ${xl_pin_led_green}
      mode: { output: true }
    restore_mode: ALWAYS_OFF

  - platform: gpio
    id: led_blue
    name: "LED Blue"
    pin:
      xl9535: xl9535_hub
      number: ${xl_pin_led_blue}
      mode: { output: true }
    restore_mode: ALWAYS_OFF

  # ---- 键盘矩阵行（GPIO0 / GPIO46）----
  # 行线不再由 switch 常驻驱动：改由 key_scan.h 的差分扫描在扫描瞬间切成输出，
  # 平时保持高阻输入。原因见 key_scan.h 头部（mpup 实测：列线悬空，必须差分判键）。

# ---- 键盘矩阵列（XL9535 输入 P0.0 / P0.4 / P0.6）----
# 这三个传感器只为把列脚配置成输入（XL9535 上电默认即输入），状态本身不用；
# 真正的判键在 script.yaml 的 key_scan → key_scan.h 差分扫描里完成。
binary_sensor:
  - platform: gpio
    id: bs_col0
    pin:
      xl9535: xl9535_hub
      number: ${xl_pin_key_col0}
      mode: INPUT
      inverted: true
    internal: true

  - platform: gpio
    id: bs_col4
    pin:
      xl9535: xl9535_hub
      number: ${xl_pin_key_col4}
      mode: INPUT
      inverted: true
    internal: true

  - platform: gpio
    id: bs_col6
    pin:
      xl9535: xl9535_hub
      number: ${xl_pin_key_col6}
      mode: INPUT
      inverted: true
    internal: true

  # ---- 6 个功能键（由 script.yaml 的 key_scan 差分扫描发布状态）----
  # 消抖 30ms：扫描周期 20ms，30ms 窗口要求连续 2 个采样一致才认；
  # 单次脏读直接滤掉，同时 60ms 以上的短按也能可靠触发（50ms 会漏掉快按）。
  - platform: template
    id: key_a
    internal: true
    filters:
      - delayed_on: 30ms
      - delayed_off: 30ms
    on_press:
      - light.toggle:                   # A 息屏 / 亮屏（按一下灭、再按一下亮）
          id: backlight
          transition_length: 300ms

  - platform: template
    id: key_right
    internal: true
    filters:
      - delayed_on: 30ms
      - delayed_off: 30ms
    on_press:
      - script.execute: greet_next      # RIGHT 下一句问候语

  - platform: template
    id: key_up
    internal: true
    filters:
      - delayed_on: 30ms
      - delayed_off: 30ms
    on_press:
      - media_player.volume_up:         # UP 音量 +
          id: speaker_media_player

  - platform: template
    id: key_down
    internal: true
    filters:
      - delayed_on: 30ms
      - delayed_off: 30ms
    on_press:
      - media_player.volume_down:       # DOWN 音量 -
          id: speaker_media_player

  - platform: template
    id: key_b
    internal: true
    filters:
      - delayed_on: 30ms
      - delayed_off: 30ms
    on_press:
      - switch.toggle: mute             # B 静音切换

  - platform: template
    id: key_left
    internal: true
    filters:
      - delayed_on: 30ms
      - delayed_off: 30ms
    on_press:
      - light.turn_off: ws2812          # LEFT 关 WS2812（下次状态切换自动恢复）

# ---- 输出：屏幕背光 BL=GPIO14 ----
output:
  - platform: ledc
    pin: GPIO14
    id: backlight_output

# ---- 灯 ----
light:
  # 屏幕背光
  - platform: monochromatic
    id: backlight
    name: "LCD Backlight"
    output: backlight_output
    restore_mode: ALWAYS_ON
    entity_category: config

  # 10 颗 WS2812（esp-idf 框架下用 RMT 方案，不用 neopixelbus）
  - platform: esp32_rmt_led_strip
    id: ws2812
    name: "Ambient Light"
    pin: GPIO42
    num_leds: 10
    channel_colors: GRB   # 新 API（旧 rgb_order 2027.3.0 起移除）
    chipset: ws2812
    restore_mode: ALWAYS_OFF
    effects:
      - addressable_rainbow:
      - addressable_scan:
      - pulse:
      - flicker:
      - strobe:

# ---- 音频编解码器（I2C 控制 + I2S 数据）----
audio_adc:
  - platform: es7210
    id: es7210_adc
    i2c_id: i2c_bus
    address: 0x43          # 按小程实测（ADDR 跳线），非默认 0x40
    bits_per_sample: 16bit
    sample_rate: 16000

audio_dac:
  - platform: es8311
    id: es8311_dac
    i2c_id: i2c_bus
    address: 0x18
    bits_per_sample: 16bit
    sample_rate: 16000    # 与麦克风同频（MCLK 恒 4.096MHz，切换阶段不换频）

# ---- 屏幕：mipi_spi 新 API（旧版是 st7789v 平台，不可混用）----
display:
  - platform: mipi_spi
    id: lcd
    model: ST7789V
    cs_pin: GPIO21
    dc_pin: GPIO48
    reset_pin:
      xl9535: xl9535_hub
      number: ${xl_pin_lcd_rst}
    dimensions:
      width: 240
      height: 320
    rotation: 90°          # 2.0" 屏横屏 320x240；方向不对改 0°/180°/270°
    invert_colors: true
    data_rate: 40MHz       # 默认 10MHz 整屏重绘要 200ms+，会阻塞主循环；花屏就降回 20MHz
    update_interval: never
    pages:
      # 初始化中（黑底图）
      - id: initializing_page
        lambda: |-
          it.image(160, 120, id(img_loading), ImageAlign::CENTER);
          draw_battery(it, id(icon_font), id(text_color), id(battery_percent), id(battery_voltage), id(api_status));
      # 无 WiFi（文字页）
      - id: no_wifi_page
        lambda: |-
          it.fill(id(bg_color));
          it.printf(160, 100, id(font_main), id(text_color), esphome::display::TextAlign::TOP_CENTER, "未连接WiFi");
          draw_battery(it, id(icon_font), id(text_color), id(battery_percent), id(battery_voltage), id(api_status));
      # 无 Home Assistant（文字页）
      - id: no_ha_page
        lambda: |-
          it.fill(id(bg_color));
          it.printf(160, 100, id(font_main), id(text_color), esphome::display::TextAlign::TOP_CENTER, "未连接HA");
          draw_battery(it, id(icon_font), id(text_color), id(battery_percent), id(battery_voltage), id(api_status));
      # 空闲：日期星期 + 大时钟 + 时段问候语（无图片）
      - id: idle_page
        lambda: |-
          it.fill(id(bg_color));
          auto t = id(ha_time).now();
          if (t.is_valid()) {
            // 星期映射：ESPTime 约定 day_of_week 1=周日 ... 7=周六
            // 若实测星期偏了一天，改下面的 -1 偏移即可
            static const char *WD[] = {"日", "一", "二", "三", "四", "五", "六"};
            int h = t.hour;
            const char *prefix;
            if (h >= 23 || h < 5)  prefix = "夜深了";
            else if (h < 9)        prefix = "早上好";
            else if (h < 11)       prefix = "上午好";
            else if (h < 13)       prefix = "中午好";
            else if (h < 18)       prefix = "下午好";
            else                   prefix = "晚上好";
            char datebuf[32];
            t.strftime(datebuf, sizeof(datebuf), "%m月%d日");
            int wd = t.day_of_week;
            if (wd < 1) wd = 1;
            if (wd > 7) wd = 7;
            it.printf(160, 36, id(font_main), id(text_color), esphome::display::TextAlign::TOP_CENTER,
                      "%s 星期%s", datebuf, WD[wd - 1]);
            it.strftime(160, 76, id(font_time), id(text_color), esphome::display::TextAlign::TOP_CENTER, "%H:%M", t);
            // 问候语：LEFT/RIGHT 可切，越界兜底（数组在 display_helpers.h）
            int gi = id(greet_idx);
            if (gi < 0 || gi >= GREETINGS_COUNT) gi = 0;
            it.printf(160, 170, id(font_main), id(accent_color), esphome::display::TextAlign::TOP_CENTER,
                      "%s，%s", prefix, GREETINGS[gi]);
          }
          draw_battery(it, id(icon_font), id(text_color), id(battery_percent), id(battery_voltage), id(api_status));
      # 聆听（白底图）
      - id: listening_page
        lambda: |-
          it.image(160, 120, id(img_listening), ImageAlign::CENTER);
          draw_battery(it, id(icon_font), id(dark_text_color), id(battery_percent), id(battery_voltage), id(api_status));
      # 思考（白底图）
      - id: thinking_page
        lambda: |-
          it.image(160, 120, id(img_thinking), ImageAlign::CENTER);
          draw_battery(it, id(icon_font), id(dark_text_color), id(battery_percent), id(battery_voltage), id(api_status));
      # 回复：白底图 + 顶部问题框 / 底部回复框（只描边不填底，图片不被遮住）
      # 框位依据：replying 图的非白内容实测在 x[80,239] y[44,199]，
      # 于是上框放进 y2..44、下框放进 y198..238 这两条空白带；
      # 上框右边只到 254，把右上角 60px 让给电量/WiFi/HA 三个图标（各 20px）。
      # 文字行高 20（font_small 18），上下各 2 行。
      - id: replying_page
        lambda: |-
          it.image(160, 120, id(img_replying), ImageAlign::CENTER);
          if (!id(text_request).state.empty()) {
            draw_text_frame(it, 10, 2, 244, 42, id(dark_text_color));
            draw_wrapped(it, id(text_request), id(font_small), id(dark_text_color), 16, 3, 232, 2, 20);
          }
          if (!id(text_response).state.empty()) {
            draw_text_frame(it, 10, 198, 300, 40, id(dark_text_color));
            draw_wrapped(it, id(text_response), id(font_small), id(dark_text_color), 16, 199, 288, 2, 20);
          }
          draw_battery(it, id(icon_font), id(dark_text_color), id(battery_percent), id(battery_voltage), id(api_status));
      # 错误（黑底图）
      - id: error_page
        lambda: |-
          it.image(160, 120, id(img_error), ImageAlign::CENTER);
          draw_battery(it, id(icon_font), id(text_color), id(battery_percent), id(battery_voltage), id(api_status));
      # 定时器结束（白底图）
      - id: timer_finished_page
        lambda: |-
          it.image(160, 120, id(img_timer_finished), ImageAlign::CENTER);
          draw_battery(it, id(icon_font), id(dark_text_color), id(battery_percent), id(battery_voltage), id(api_status));
      # 静音
      - id: muted_page
        lambda: |-
          it.fill(id(bg_color));
          it.printf(160, 100, id(font_main), id(text_color), esphome::display::TextAlign::TOP_CENTER, "已静音");
          draw_battery(it, id(icon_font), id(text_color), id(battery_percent), id(battery_voltage), id(api_status));

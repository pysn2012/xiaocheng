# 语音助手：ES7210 麦克风(16k) + ES8311 喇叭(48k) + microWakeWord
# 唤醒词: "Okay Nabu" → 唤醒后语音对话 / 语音控制 HA
# 麦克风 16k 是 microWakeWord 的硬约束（模型只吃 16k）；喇叭走 48k，对齐 HA TTS
# 的原生采样率，避免被降到 16k（那样带宽只剩 8kHz）。两者是各自独立的 I2S 通道，
# 采样率不必相同（box-3 / lc-szpi 都是 16k+48k 这个组合）。
# 注：切换阶段 MCLK 会在 4.096MHz / 12.288MHz 之间变化，但 ESPHome 的 i2s_audio 在
# 每次 mic↔speaker 切换时本来就会销毁并重建 I2S 通道，所以这里并不额外引入启停瞬态。

globals:
  # 标记设备是否仍在初始化
  - id: init_in_progress
    type: bool
    restore_value: false
    initial_value: "true"
  # 当前语音助手阶段
  - id: voice_assistant_phase
    type: int
    restore_value: false
    initial_value: ${voice_assist_not_ready_phase_id}
  # 空闲页问候语索引（条数见 display_helpers.h 的 GREETINGS_COUNT）
  - id: greet_idx
    type: int
    restore_value: false
    initial_value: "0"
  # 是否用 LEFT/RIGHT 手动挑过问候语：挑过就不再被随机取词覆盖（重启恢复随机）
  - id: greet_manual
    type: bool
    restore_value: false
    initial_value: "false"

# 麦克风：ES7210 → DIN=GPIO18
microphone:
  - platform: i2s_audio
    id: box_mic
    i2s_audio_id: i2s_bus
    adc_type: external
    i2s_din_pin: GPIO18
    pdm: false
    sample_rate: 16000
    bits_per_sample: 16bit
    channel: left

# 喇叭：ES8311 → DOUT=GPIO13 → NS4152 功放
speaker:
  - platform: i2s_audio
    id: box_speaker
    i2s_audio_id: i2s_bus
    i2s_dout_pin: GPIO13
    dac_type: external
    audio_dac: es8311_dac
    sample_rate: 48000   # 与 es8311_dac 一致；48k 对齐 HA TTS 原生采样率（16k 会砍掉 8kHz 以上）
    bits_per_sample: 16bit
    channel: mono
    buffer_duration: 500ms   # 100ms 偏小，播放时可能欠载出杂音

# 媒体播放器：播 TTS / 提示音
media_player:
  - platform: speaker
    name: None
    id: speaker_media_player
    # 音量范围 = ES8311 的 REG32 数字音量寄存器（线性 0..255）：
    #   0.75 = 0xBF = 0dB（datasheet 的 0dB 点）    1.0 = 0xFF = +32dB
    # 所以旧的 0.8~1.0 等于全程 +6.5dB~+32dB，信号和量化噪声一起被抬高几十 dB
    # → "声音很大但明显噪声"。mpup（同一台掌机，声音正常）用 esp_codec_dev，
    # 它的音量 100 就是 0dB，所以这里把上限压到 0.75 与 mpup 对齐。
    #   0.50 → REG32 127 → -32dB      0.75 → REG32 191 → 0dB
    volume_min: 0.5
    volume_max: 0.75
    volume_initial: 0.7       # → REG32 ≈172 → 约 -9.5dB
    volume_increment: 0.02    # 音量键步进 ≈2.6dB（默认 0.05 太粗）
    announcement_pipeline:
      speaker: box_speaker
      format: WAV
      sample_rate: 48000
      num_channels: 1
    on_announcement:
      # 播放前显式关麦：彻底释放 ES7210/I2S 收音通路，
      # 播放期间独占总线（半双工），杜绝回环串进功放的电流声
      - microphone.stop_capture:
      # 播报时若麦克风在收音，先停唤醒词，避免回声自触发
      - if:
          condition:
            - microphone.is_capturing:
          then:
            - script.execute: stop_wake_word
            - if:
                condition:
                  - lambda: return id(wake_word_engine_location).current_option() == "In Home Assistant";
                then:
                  - wait_until:
                      - not:
                          voice_assistant.is_running:
      # 非语音流程的主动播放 → 显示静音界面
      - if:
          condition:
            not:
              voice_assistant.is_running:
          then:
            - lambda: id(voice_assistant_phase) = ${voice_assist_muted_phase_id};
            - script.execute: draw_display
    on_idle:
      # 播放结束，重启唤醒词
      - if:
          condition:
            not:
              voice_assistant.is_running:
          then:
            - script.execute: start_wake_word
            - script.execute: set_idle_or_mute_phase
            - script.execute: draw_display

# 设备端唤醒词引擎
micro_wake_word:
  id: mww
  models:
    - okay_nabu
  on_wake_word_detected:
    - voice_assistant.start:
        wake_word: !lambda return wake_word;

# 语音助手核心
voice_assistant:
  id: va
  microphone: box_mic
  media_player: speaker_media_player
  micro_wake_word: mww
  noise_suppression_level: 2
  auto_gain: 31dBFS
  volume_multiplier: 2.0
  on_listening:
    # 息屏（A 键关背光）状态下被唤醒 → 自动亮屏，并直接给满亮度
    # （唤醒是"我要用它了"，亮到底比沿用上次调暗的值更合适）。
    # 挂在 on_listening 而不是 on_wake_word_detected：设备端 mWW 和 HA 端唤醒词
    # 两种模式都会走到这里；灯已经亮着就完全不动它（不重设亮度）。
    - if:
        condition:
          light.is_off: backlight
        then:
          - light.turn_on:
              id: backlight
              brightness: 100%
              transition_length: 200ms
    - lambda: id(voice_assistant_phase) = ${voice_assist_listening_phase_id};
    - script.execute: va_light_listening
    - text_sensor.template.publish:
        id: text_request
        state: "..."
    - text_sensor.template.publish:
        id: text_response
        state: "..."
    - script.execute: draw_display
  on_stt_vad_end:
    - lambda: id(voice_assistant_phase) = ${voice_assist_thinking_phase_id};
    - script.execute: va_light_thinking
    - script.execute: draw_display
  on_stt_end:
    - text_sensor.template.publish:
        id: text_request
        state: !lambda return x;
    - script.execute: draw_display
  on_tts_start:
    - text_sensor.template.publish:
        id: text_response
        state: !lambda return x;
    - lambda: id(voice_assistant_phase) = ${voice_assist_replying_phase_id};
    - script.execute: va_light_replying
    - script.execute: draw_display
  on_end:
    # 等播报开始，再等播报结束（I2S 空闲）后才恢复唤醒词
    - wait_until:
        condition:
          - media_player.is_announcing:
        timeout: 0.5s
    - wait_until:
        - and:
            - not:
                media_player.is_announcing:
            - not:
                speaker.is_playing:
    - if:
        condition:
          - lambda: return id(wake_word_engine_location).current_option() == "On device";
        then:
          - lambda: id(va).set_use_wake_word(false);
          - micro_wake_word.start:
    - script.execute: set_idle_or_mute_phase
    - script.execute: draw_display
    - text_sensor.template.publish:
        id: text_request
        state: ""
    - text_sensor.template.publish:
        id: text_response
        state: ""
  on_error:
    - if:
        condition:
          lambda: return !id(init_in_progress);
        then:
          - lambda: id(voice_assistant_phase) = ${voice_assist_error_phase_id};
          - script.execute: draw_display
          - delay: 1s
          - script.execute: set_idle_or_mute_phase
          - script.execute: draw_display
  on_client_connected:
    - lambda: id(init_in_progress) = false;
    - script.execute: start_wake_word
    - script.execute: set_idle_or_mute_phase
    - script.execute: draw_display
  on_client_disconnected:
    - script.execute: stop_wake_word
    - script.execute: va_light_off
    - lambda: id(voice_assistant_phase) = ${voice_assist_not_ready_phase_id};
    - script.execute: draw_display
  # 设备端定时器结束：显示结束页 10 秒后回空闲
  on_timer_finished:
    - lambda: id(voice_assistant_phase) = ${voice_assist_timer_finished_phase_id};
    - script.execute: draw_display
    - delay: 10s
    - script.execute: set_idle_or_mute_phase
    - script.execute: draw_display

# 软件静音开关
switch:
  - platform: template
    name: Mute
    id: mute
    icon: "mdi:microphone-off"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    entity_category: config
    on_turn_off:
      - microphone.unmute:
      - lambda: id(voice_assistant_phase) = ${voice_assist_idle_phase_id};
      - script.execute: draw_display
    on_turn_on:
      - microphone.mute:
      - lambda: id(voice_assistant_phase) = ${voice_assist_muted_phase_id};
      - script.execute: draw_display

# 唤醒词引擎位置：设备端 / HA 端
select:
  - platform: template
    entity_category: config
    name: Wake word engine location
    id: wake_word_engine_location
    icon: "mdi:account-voice"
    optimistic: true
    restore_value: true
    options:
      - In Home Assistant
      - On device
    initial_option: On device
    on_value:
      - if:
          condition:
            lambda: return !id(init_in_progress);
          then:
            - wait_until:
                lambda: return id(voice_assistant_phase) == ${voice_assist_muted_phase_id} || id(voice_assistant_phase) == ${voice_assist_idle_phase_id};
            - if:
                condition:
                  lambda: return x == "In Home Assistant";
                then:
                  - micro_wake_word.stop
                  - delay: 500ms
                  - if:
                      condition:
                        switch.is_off: mute
                      then:
                        - lambda: id(va).set_use_wake_word(true);
                        - voice_assistant.start_continuous:
            - if:
                condition:
                  lambda: return x == "On device";
                then:
                  - lambda: id(va).set_use_wake_word(false);
                  - voice_assistant.stop
                  - delay: 500ms
                  - if:
                      condition:
                        switch.is_off: mute
                      then:
                        - micro_wake_word.start
